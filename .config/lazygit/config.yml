# lazygit config
#
# Diff engine: difftastic (structural) with a builtin-diff fallback.
# Press `|` in any diff view to cycle between the two pagers below.
#
# Why two pagers:
#  - difft is VIEW-ONLY inside lazygit. Line/hunk staging in the main panel
#    needs the builtin diff, so toggle to the `{}` entry with `|` before staging.
#  - difft cannot run as a plain pager (it needs the whole diff), so it must be
#    wired via externalDiffCommand, not `pager`.
#
# Tweaks:
#  - `--display=inline` is used because lazygit captures difft's output through a
#    pipe, so difft cannot detect the panel width and assumes 80 cols. Inline
#    stays readable regardless. For difft's side-by-side view, drop that flag.
#  - Add `--syntax-highlight=off` to the difft line if the colors ever clash.
git:
  pagers:
    - externalDiffCommand: difft --color=always
    - externalDiffCommand: difft --color=always --display=inline
    - {} # builtin diff (needed for line/hunk staging)
