################################################################################
# Plugins

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-plugins/tmux-pain-control
set -g @plugin 'tmux-plugins/tmux-pain-control'
set-option -g @pane_resize "1"

# tmux-plugins/tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'kitty'
set -g @continuum-restore 'on'

# tinted-theming/tinted-tmux
set -g @plugin 'tinted-theming/tinted-tmux'
set -g @tinted-color "base16-$BASE16_THEME"

################################################################################
# TPM (must be last). Homebrew installs and updates TPM itself, so it is not
# listed as a plugin. Stow deploys this fragment before the tpm module installs TPM.
# The path is literal: tmux expands $VAR in the nested command but not
# ${VAR:-default}. homebrew/profile.zsh assumes /opt/homebrew too.
if-shell 'test -x /opt/homebrew/opt/tpm/share/tpm/tpm' 'run-shell /opt/homebrew/opt/tpm/share/tpm/tpm'

# Override status applied by tinted-theming/tinted-tmux
set-option -g status-right ""

