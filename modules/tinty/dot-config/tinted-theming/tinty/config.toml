shell = "zsh -c '{}'"
default-scheme = "base16-catppuccin-macchiato"

[[items]]
name = "base16-shell"
path = "https://github.com/tinted-theming/base16-shell"
themes-dir = "scripts"
hook = "source %f"
supported-systems = ["base16"]

[[items]]
path = "https://github.com/tinted-theming/tinted-tmux"
name = "tinted-tmux"
hook = "tmux run 2> /dev/null && tmux source-file %f"
themes-dir = "colors"

[[items]]
name = "tinted-herdr"
path = "https://github.com/pardom/tinted-herdr"
themes-dir = "themes"
supported-systems = ["base16", "base24"]
hook = "mkdir -p \"$HOME/.config/herdr-app/themes\" && cp -f \"$TINTY_THEME_FILE_PATH\" \"$HOME/.config/herdr-app/themes/tinted.json\""

[[items]]
name = "tinted-claude-code"
path = "https://github.com/tinted-theming/tinted-claude-code"
themes-dir = "scripts"
theme-file-extension = ".js"
supported-systems = ["base16", "base24", "tinted8"]
hook = "mkdir -p \"$HOME/.claude/themes\" && node \"$TINTY_THEME_FILE_PATH\" > \"$HOME/.claude/themes/tinty.json\""
