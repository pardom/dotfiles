[options]
focus_follows_mouse = true
mouse_follows_focus = true
horizontal_mouse_warp = 1                            # -1 or 1; omit to disable
horizontal_mouse_warp_offset = 0                     # px
preset_column_widths = [0.25, 0.33, 0.5, 0.66, 0.75]
animation_speed = 12.0                               # recommended 8–20
auto_center = false
sliver_height = 1.0                                  # 0.1–1.0
sliver_width = 5                                     # px
window_hidden_ratio = 0.0                            # 0.0–1.0
window_resize_cycle = true
mouse_resize_modifier = "cmd + shift"
reap_empty_workspaces = false

[padding]
top = 10
bottom = 10
left = 10
right = 10

[swipe]
sensitivity = 0.35 # 0.1–2.0
deceleration = 4.0 # 1.0–10.0
continuous = true

[swipe.gesture]
fingers_count = 3     # ≥3 to enable
direction = "Natural" # "Natural" | "Reversed"
vertical = true

[swipe.scroll]
modifier = "alt"
vertical_modifier = "shift"

# Native macOS dimming — set ONLY opacity (no color)
[decorations.inactive.dim]
opacity = -0.15       # -1.0..1.0; negative = darker
opacity_night = -0.25

# Experimental active-window border
[decorations.active.border]
enabled = false
color = "#89b4fa"
opacity = 1.0
width = 2.0
radius = "auto"   # number or "auto"

[bindings]
# Focus
window_focus_west = "alt - h"
window_focus_east = "alt - l"
window_focus_north = "alt - k"
window_focus_south = "alt - j"
window_focus_first = "alt + shift - h"
window_focus_last = "alt + shift - l"

# Swap
window_swap_west = "alt + shift - h"
window_swap_east = "alt + shift - l"
window_swap_north = "alt + shift - k"
window_swap_south = "alt + shift - j"
# window_swap_first = "cmd + alt + shift - h"
# window_swap_last  = "cmd + alt + shift - l"

# Sizing
window_center = "alt - c"
window_resize = "alt - r"
window_grow = "alt - ="
window_shrink = "alt - minus"
window_fullwidth = "alt - f"

# State
window_manage = "alt - t"
window_stack = "alt - s"
window_unstack = "alt + shift - s"
window_equalize = "alt - e"
window_snap = "alt - v"

# Display
window_nextdisplay = "cmd + alt - n"
window_nextdisplaysend = "cmd + alt + shift - n"
mouse_nextdisplay = "cmd + alt - m"

# Virtual workspaces — directional
window_virtual_north = "cmd + shift - k"
window_virtual_south = "cmd + shift - j"
window_virtualmove_north = "cmd + alt - k"
window_virtualmove_south = "cmd + alt - j"
window_virtualsend_north = "cmd + alt + shift - k"
window_virtualsend_south = "cmd + alt + shift - j"

# Virtual workspaces — numbered
window_virtualnum_1 = "cmd + alt - 1"
window_virtualnum_2 = "cmd + alt - 2"
window_virtualnum_3 = "cmd + alt - 3"
window_virtualnum_4 = "cmd + alt - 4"
window_virtualnum_5 = "cmd + alt - 5"

window_virtualmovenum_1 = "cmd + alt + ctrl - 1"
window_virtualmovenum_2 = "cmd + alt + ctrl - 2"
window_virtualmovenum_3 = "cmd + alt + ctrl - 3"

window_virtualsendnum_1 = "cmd + alt + shift - 1"
window_virtualsendnum_2 = "cmd + alt + shift - 2"
window_virtualsendnum_3 = "cmd + alt + shift - 3"

quit = "cmd + alt + ctrl - q"

[windows]
title = ".*"
horizontal_padding = 10
vertical_padding = 10

# Per-window rules — `title` regex is required
[windows.terminal]
title = ".*"
bundle_id = "com.apple.Terminal"
horizontal_padding = 5
vertical_padding = 0
bindings_passthrough = ["ctrl-h", "ctrl-l"]

[windows.iterm]
title = ".*"
bundle_id = "com.googlecode.iterm2"
index = 0                           # preferred strip position

[windows.browser]
title = ".*"
bundle_id = "com.google.Chrome"
width = 0.66

[windows.finder_info_float]
title = "Info"
bundle_id = "com.apple.finder"
floating = true
grid = "1:1:0:0:1:1"           # cols:rows:x:y:w:h

[windows.system_settings]
title = ".*"
bundle_id = "com.apple.systempreferences"
floating = true
dont_focus = true

[restore]
enabled = true
startup_grace_ms = 2000
missing_windows = "ignore"
